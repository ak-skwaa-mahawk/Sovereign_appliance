name: Sovereign Appliance CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-appliance:
    name: Build, Smoke Test & CAmkES Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sovereign-appliance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-arm \
            gcc \
            clang \
            libssl-dev \
            python3 \
            python3-pip \
            python3-cryptography \
            gzip \
            cpio

      - name: Compile CAmkES Dataport Reader
        run: |
          clang -Wall -Wextra -O2 gate_dataport_reader.c -lcrypto -o gate_dataport_reader
          ./gate_dataport_reader --help 2>&1 || true

      - name: Run Host-Side Test Harness & Generate Quorum Approval
        run: |
          python3 -m pip install toml cryptography
          python3 test_handshake_harness.py

      - name: Cryptographically Verify Approval Vector with C Reader
        run: |
          ./gate_dataport_reader ./workspace/harness_approval.bin ./workspace/notary_keys

      - name: Execute QEMU Smoke Test (if kernel & initramfs present)
        run: |
          if [ -f "./vmlinuz-virt" ] && [ -f "./sovr-initramfs-aarch64.cpio.gz" ]; then
            chmod +x test_appliance_smoke.sh
            ./test_appliance_smoke.sh
          else
            echo "[!] Kernel or initramfs not committed to VCS (expected for large binaries). Smoke test skipped in lightweight CI."
          fi
